[package]
name = "aion2-assistente"
description = "Aion 2 Assistente: medidor de DPS por captura passiva"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# TLS do Windows, como o reqwest abaixo; o instalador NSIS chega sem zip.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
# TLS do próprio Windows (SChannel), sem compilar biblioteca de criptografia.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "charset", "http2"] }
capture = { workspace = true, features = ["live"] }
protocol.workspace = true
combat.workspace = true
storage.workspace = true
pipeline.workspace = true
tracker.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }
