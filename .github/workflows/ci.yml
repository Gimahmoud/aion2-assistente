name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Subir a versão do app na main já publica a release sozinho (job do
  # Windows). Uma release criada à mão também publica, uma vez só.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (lógica e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Só os crates de lógica: o app Tauri é verificado no job do Windows.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ui:
    name: Interface (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    needs: [rust, ui]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Publica sozinho quando a versão do app sobe na main (a tag ainda não
      # existe). Uma release criada à mão na página do GitHub também publica.
      - name: Versão nova?
        id: versao
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          publish=false
          if [ "$EVENT" = release ]; then
            if [ "$RELEASE_TAG" != "$tag" ]; then
              echo "::error::A tag $RELEASE_TAG não bate com a versão do app ($version). Suba a versão antes da release."
              exit 1
            fi
            publish=true
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Versão $version ainda não publicada: criando a release $tag."
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # O SDK do Npcap traz wpcap.lib para linkar. O usuário final instala o
      # Npcap pelo site oficial; nada do Npcap vai dentro do instalador.
      - name: Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.15.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
        working-directory: ui
      - run: cargo clippy -p aion2-assistente -- -D warnings
      # O instalador é assinado com a chave do updater: o app só aceita
      # atualização assinada por ela. Sem o secret (PR de fork), gera o
      # instalador sem os arquivos de atualização; numa release, falha.
      - name: Build
        shell: bash
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ../ui/node_modules/.bin/tauri build
          elif [ "${{ steps.versao.outputs.publish }}" = true ]; then
            echo "::error::Falta o secret TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          else
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: instalador gerado sem atualização automática."
            ../ui/node_modules/.bin/tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: target/release/bundle/nsis/*.exe
      # latest.json é o que o app instalado consulta ao abrir. O GitHub troca
      # espaços por pontos no nome dos anexos, então o nome já sobe assim.
      - name: Preparar atualização automática
        if: steps.versao.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.versao.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          exe=$(ls target/release/bundle/nsis/*.exe)
          name=$(basename "$exe" | tr ' ' '.')
          mkdir publicar
          cp "$exe" "publicar/$name"
          SIG=$(cat "$exe.sig") URL="https://github.com/$REPO/releases/download/$TAG/$name" VERSION="$version" \
            node -e 'const e = process.env; console.log(JSON.stringify({
              version: e.VERSION,
              notes: `Veja as novidades em https://github.com/${e.REPO}/releases/tag/${e.TAG}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: e.SIG, url: e.URL } },
            }, null, 2))' > publicar/latest.json
          cat publicar/latest.json
      # O app procura em "releases/latest", que ignora pré-releases: por isso
      # a release vira a mais recente.
      - name: Publicar release
        if: steps.versao.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: publicar/*
          body_path: .github/release-notes.md
          prerelease: false
          make_latest: true
