[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/combat",
    "crates/capture",
    "crates/storage",
    "crates/pipeline",
    "crates/tracker",
    "src-tauri",
]
# O app Tauri precisa de WebView2/webkit para compilar; os crates de lógica não.
default-members = [
    "crates/protocol",
    "crates/combat",
    "crates/capture",
    "crates/storage",
    "crates/pipeline",
    "crates/tracker",
]

[workspace.package]
version = "0.3.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gimahmoud/aion2-assistente"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
combat = { path = "crates/combat" }
capture = { path = "crates/capture" }
storage = { path = "crates/storage" }
pipeline = { path = "crates/pipeline" }
tracker = { path = "crates/tracker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"
